<svg xmlns="http://www.w3.org/2000/svg" width="{{t:walkthrough.side-quest-wards.width|attr}}" height="370" viewBox="0 0 228 370" role="img" aria-labelledby="title" lang="{{t:site.html-language|attr}}">
  <title id="title">{{t:walkthrough.side-quest-wards.title}}</title>
  <style>
    :root { background: #131d24; }
    text { font: 16px "Segoe UI", "Microsoft JhengHei UI", sans-serif; fill: #dce4e7; text-anchor: middle; }
    .paths { fill: none; stroke: #91a7a0; stroke-width: 1.7; stroke-linejoin: round; marker-end: url(#arrow); }
    .branch { stroke-dasharray: 4 4; }
    .nodes rect { fill: #1e2b33; stroke: #50646b; }
    .hub rect { fill: #283a40; stroke: #839d99; }
    .hub text:first-of-type, .decision text { font-weight: 600; }
    .nodes .decision rect { fill: #19272e; stroke: #96b2ae; stroke-dasharray: 3 3; }
    .nodes .goal rect { fill: #39342b; stroke: #e5bb70; stroke-width: 1.5; }
    .goal text:first-of-type { fill: #f0ce91; font-weight: 600; }
    .labels rect { fill: #15222a; stroke: #486169; }
    .labels text, .nodes .detail { font-size: 14px; fill: #c2d0d2; }
  </style>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1" fill="#36434a" />
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#91a7a0" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#dots)" />
  <g transform="translate(-22 -5)">
    <g class="paths">
      <path id="L_ask_wards" d="M136 67 V161.38" />
      <path id="L_wards_report" d="M136 224.38 V291.94" />
    </g>
    <g class="labels">
      <g>
        <rect x="49" y="97.09" width="174" height="24" rx="12" />
        <text x="136" y="114.09">{{t:walkthrough.side-quest-wards.line-01}}</text>
      </g>
    </g>
    <g class="nodes">
      <g id="ask" class="hub">
        <rect x="74" y="25" width="124" height="42" rx="6" />
        <text x="136" y="51.5">{{t:walkthrough.side-quest-wards.line-02}}</text>
      </g>
      <g id="wards" class="hub">
        <rect x="73" y="161.38" width="126" height="63" rx="6" />
        <text x="136" y="187.88">{{t:guide.khelebar_stone}}</text>
        <text x="136" y="208.88" class="detail">{{t:walkthrough.side-quest-wards.line-04}}</text>
      </g>
      <g id="report" class="goal">
        <rect x="56" y="291.94" width="160" height="63" rx="6" />
        <text x="136" y="318.44">{{t:walkthrough.side-quest-wards.line-05}}</text>
        <text x="136" y="339.44" class="detail">{{t:walkthrough.side-quest-wards.line-06}}</text>
      </g>
    </g>
  </g>
</svg>
