      <path id="L_rescue_visits" d="M136 263.02 V353.1" />
      <path id="L_rescue_source" d="M206 231.52 H366 V374.1" />
      <path id="L_source_kill" d="M346 437.1 V460.54 H280 V542.74" />
      <path id="L_source_spare" d="M386 437.1 V460.54 H453 V542.74" />
