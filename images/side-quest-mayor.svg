<svg xmlns="http://www.w3.org/2000/svg" width="354" height="800" viewBox="0 0 354 800" role="img" aria-labelledby="title" lang="zh-Hant">
  <title id="title">村長奧爾登的三個委託</title>
  <style>
    :root { background: #131d24; }
    text { font: 16px "Segoe UI", "Microsoft JhengHei UI", sans-serif; fill: #dce4e7; text-anchor: middle; }
    .paths { fill: none; stroke: #91a7a0; stroke-width: 1.7; stroke-linejoin: round; marker-end: url(#arrow); }
    .branch { stroke-dasharray: 4 4; }
    .nodes rect { fill: #1e2b33; stroke: #50646b; }
    .hub rect { fill: #283a40; stroke: #839d99; }
    .hub text:first-of-type, .decision text { font-weight: 600; }
    .nodes .decision rect { fill: #19272e; stroke: #96b2ae; stroke-dasharray: 3 3; }
    .nodes .goal rect { fill: #39342b; stroke: #e5bb70; stroke-width: 1.5; }
    .goal text:first-of-type { fill: #f0ce91; font-weight: 600; }
    .labels rect { fill: #15222a; stroke: #486169; }
    .labels text, .nodes .detail { font-size: 14px; fill: #c2d0d2; }
  </style>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1" fill="#36434a" />
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#91a7a0" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#dots)" />
  <g transform="translate(-13 0)">
    <g class="paths">
      <path id="L_miners_crystal" d="M190 83.5 V153.4" />
      <path id="L_crystal_bells" d="M190 195.4 V295.22" />
      <path id="L_bells_camp" d="M190 358.22 V425.78" />
      <path id="L_camp_bracelet" d="M190 488.78 V587.62" />
      <path id="L_bracelet_pupil" d="M190 650.62 V716.82" />
    </g>
    <g class="labels">
      <g>
        <rect x="61" y="228.21" width="258" height="24" rx="12" />
        <text x="190" y="245.21">再問「還有別的需要我們幫忙的嗎？」</text>
      </g>
      <g>
        <rect x="89" y="521.1" width="202" height="24" rx="12" />
        <text x="190" y="538.1">再問「還有別的煩心事嗎？」</text>
      </g>
    </g>
    <g class="nodes">
      <g id="miners" class="hub">
        <rect x="43" y="20.5" width="294" height="63" rx="6" />
        <text x="190" y="47">北方的回聲</text>
        <text x="190" y="68" class="detail">向村長打聽工作，到枯萎礦脈追查四名礦工</text>
      </g>
      <g id="crystal">
        <rect x="56" y="153.4" width="268" height="42" rx="6" />
        <text x="190" y="179.9">擊敗破碎者，回村報告礦工的下落</text>
      </g>
      <g id="bells" class="hub">
        <rect x="85" y="295.22" width="210" height="63" rx="6" />
        <text x="190" y="321.72">Underkeep 的鐘聲</text>
        <text x="190" y="342.72" class="detail">警鐘響起，到西門擊退半獸人</text>
      </g>
      <g id="camp">
        <rect x="33" y="425.78" width="314" height="63" rx="6" />
        <text x="190" y="452.28">回村長家接下追查委託</text>
        <text x="190" y="473.28" class="detail">到 Underkeep 之根擊敗強盜首領，再回報村長</text>
      </g>
      <g id="bracelet" class="hub">
        <rect x="71" y="587.62" width="238" height="63" rx="6" />
        <text x="190" y="614.12">嚎聲止息之地</text>
        <text x="190" y="635.12" class="detail">到凱爾林森林的狼穴深處找回鐲子</text>
      </g>
      <g id="pupil" class="goal">
        <rect x="63" y="716.82" width="254" height="63" rx="6" />
        <text x="190" y="743.32">將追憶護符交還村長</text>
        <text x="190" y="764.32" class="detail">指定一名隊員受訓，獲得 1 點技能點</text>
      </g>
    </g>
  </g>
</svg>
