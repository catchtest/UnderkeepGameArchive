<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="759" viewBox="0 0 1000 759" role="img" aria-labelledby="title" lang="zh-Hant">
  <title id="title">結局路線</title>
  <style>
    :root { background: #131d24; }
    text { font: 16px "Segoe UI", "Microsoft JhengHei UI", sans-serif; fill: #dce4e7; text-anchor: middle; }
    .paths { fill: none; stroke: #91a7a0; stroke-width: 1.7; stroke-linejoin: round; marker-end: url(#arrow); }
    .branch { stroke-dasharray: 4 4; }
    .nodes rect { fill: #1e2b33; stroke: #50646b; }
    .hub rect { fill: #283a40; stroke: #839d99; }
    .hub text:first-of-type, .decision text { font-weight: 600; }
    .nodes .decision rect { fill: #19272e; stroke: #96b2ae; stroke-dasharray: 3 3; }
    .nodes .goal rect { fill: #39342b; stroke: #e5bb70; stroke-width: 1.5; }
    .goal text:first-of-type { fill: #f0ce91; font-weight: 600; }
    .labels rect { fill: #15222a; stroke: #486169; }
    .labels text, .nodes .detail { font-size: 14px; fill: #c2d0d2; }
  </style>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1" fill="#36434a" />
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#91a7a0" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#dots)" />
  <g class="paths">
    <path id="L_top_guardians_0" d="M288 66 V107" />
    <path id="L_guardians_battle_0" d="M232 169 V196 H199 V342" />
    <path id="L_guardians_choice_0" d="M347 169 V196 H575 V224" />
    <path id="L_choice_battle_0" d="M537 268 V297 H266 V342" />
    <path id="L_choice_ally_0" d="M613 268 V297 H750 V334" />
    <path id="L_battle_weapon_0" d="M230 386 V435" />
    <path id="L_weapon_collapse_0" d="M187 495 V515 H119 V576" />
    <path id="L_weapon_below_0" d="M273 495 V515 H354 V569" />
    <path id="L_below_party_0" d="M354 629 V671" />
    <path id="L_ally_mage_0" d="M707 394 V422 H598 V569" />
    <path id="L_ally_best_0" d="M794 394 V422 H861 V569" />
  </g>
  <g class="labels">
    <g>
      <rect x="144.5" y="244" width="109" height="24" rx="12" />
      <text x="199" y="261">有守護者死亡</text>
    </g>
    <g>
      <rect x="417.5" y="184" width="85" height="24" rx="12" />
      <text x="460" y="201">全數存活</text>
    </g>
    <g>
      <rect x="335.5" y="285" width="129" height="24" rx="12" />
      <text x="400" y="302">拒絕或拔出武器</text>
    </g>
    <g>
      <rect x="635" y="285" width="86" height="24" rx="12" />
      <text x="678" y="302">答應協助</text>
    </g>
    <g>
      <rect x="91" y="533" width="56" height="24" rx="12" />
      <text x="119" y="550">沒有</text>
    </g>
    <g>
      <rect x="331" y="533" width="46" height="24" rx="12" />
      <text x="354" y="550">有</text>
    </g>
    <g>
      <rect x="526.5" y="486" width="143" height="24" rx="12" />
      <text x="598" y="503">將托倫生命降至零</text>
    </g>
    <g>
      <rect x="767" y="477" width="188" height="42" rx="12" />
      <text x="861" y="494">用虛空脈衝將活著的</text>
      <text x="861" y="512">托倫推入門內</text>
    </g>
  </g>
  <g class="nodes">
    <g id="top" class="hub">
      <rect x="182" y="24" width="212" height="42" rx="6" />
      <text x="288" y="50">高塔五層：面見大法師</text>
    </g>
    <g id="guardians" class="decision">
      <rect x="182" y="107" width="212" height="62" rx="10" />
      <text x="288" y="132.5">源頭、那個東西、古龍</text>
      <text x="288" y="153.5">是否全數存活？</text>
    </g>
    <g id="choice" class="decision">
      <rect x="490" y="224" width="170" height="44" rx="10" />
      <text x="575" y="251">如何回應大法師？</text>
    </g>
    <g id="battle" class="hub">
      <rect x="121" y="342" width="218" height="44" rx="6" />
      <text x="230" y="369">與大法師交戰並擊敗他</text>
    </g>
    <g id="ally" class="hub">
      <rect x="626" y="334" width="248" height="60" rx="6" />
      <text x="750" y="358.5">大法師開路</text>
      <text x="750" y="379.5" class="detail">回高塔入口，下到塔底找托倫</text>
    </g>
    <g id="weapon" class="decision">
      <rect x="136" y="435" width="188" height="60" rx="10" />
      <text x="230" y="459.5">戰後交談時</text>
      <text x="230" y="480.5">身上有靈魂切割者？</text>
    </g>
    <g id="collapse">
      <rect x="27" y="576" width="184" height="46" rx="6" />
      <text x="119" y="604">最壞結局：高塔崩塌</text>
    </g>
    <g id="below">
      <rect x="250.5" y="569" width="207" height="60" rx="6" />
      <text x="354" y="593.5">回高塔入口，下到塔底</text>
      <text x="354" y="614.5" class="detail">擊倒托倫或將他推入傳送門</text>
    </g>
    <g id="party">
      <rect x="244.5" y="671" width="219" height="60" rx="6" />
      <text x="354" y="695.5">普通結局 A：</text>
      <text x="354" y="716.5" class="detail">隊伍進入傳送門封印</text>
    </g>
    <g id="mage">
      <rect x="495" y="569" width="206" height="60" rx="6" />
      <text x="598" y="593.5">普通結局 B：</text>
      <text x="598" y="614.5" class="detail">大法師進入傳送門封印</text>
    </g>
    <g id="best" class="goal">
      <rect x="750" y="569" width="222" height="60" rx="6" />
      <text x="861" y="593.5">最佳結局：</text>
      <text x="861" y="614.5" class="detail">大法師從外側封印傳送門</text>
    </g>
  </g>
</svg>
