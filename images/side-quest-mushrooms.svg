<svg xmlns="http://www.w3.org/2000/svg" width="675" height="1203" viewBox="0 0 675 1203" role="img" aria-labelledby="title" lang="zh-Hant">
  <title id="title">巴洛、五朵蘑菇與東園的蛙王</title>
  <style>
    :root { background: #131d24; }
    text { font: 16px "Segoe UI", "Microsoft JhengHei UI", sans-serif; fill: #dce4e7; text-anchor: middle; }
    .paths { fill: none; stroke: #91a7a0; stroke-width: 1.7; stroke-linejoin: round; marker-end: url(#arrow); }
    .branch { stroke-dasharray: 4 4; }
    .nodes rect { fill: #1e2b33; stroke: #50646b; }
    .hub rect { fill: #283a40; stroke: #839d99; }
    .hub text:first-of-type, .decision text { font-weight: 600; }
    .nodes .decision rect { fill: #19272e; stroke: #96b2ae; stroke-dasharray: 3 3; }
    .nodes .goal rect { fill: #39342b; stroke: #e5bb70; stroke-width: 1.5; }
    .goal text:first-of-type { fill: #f0ce91; font-weight: 600; }
    .labels rect { fill: #15222a; stroke: #486169; }
    .labels text, .nodes .detail { font-size: 14px; fill: #c2d0d2; }
  </style>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1" fill="#36434a" />
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#91a7a0" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#dots)" />
  <g transform="translate(-2 -2)">
    <g class="paths">
      <path id="L_doll_five" d="M496 85.5 V191.14" />
      <path id="L_five_barlo" d="M412 222.64 H164 V373.38" />
      <path id="L_five_kin" d="M496 254.14 V373.38" />
      <path id="L_kin_bond" d="M496 436.38 V501.22" />
      <path id="L_bond_field" d="M496 564.22 V629.06" />
      <path id="L_field_rebels" d="M496 692.06 V813.64" />
      <path id="L_field_pass" d="M426 660.56 H206 V813.64" />
      <path id="L_pass_kneel" d="M112 834.64 H92 V993.16" />
      <path id="L_pass_fight" d="M226 855.64 V877.03 H278 V993.16" />
      <path id="L_rebels_rise" d="M496 855.64 V982.66" />
      <path id="L_rise_win" d="M496 1045.66 V1121.38" />
    </g>
    <g class="labels">
      <g>
        <rect x="416" y="121.22" width="160" height="24" rx="12" />
        <text x="496" y="138.22">再問巴洛有沒有新任務</text>
      </g>
      <g>
        <rect x="105" y="280.91" width="118" height="24" rx="12" />
        <text x="164" y="297.91">五朵全交給巴洛</text>
      </g>
      <g>
        <rect x="388" y="296.66" width="216" height="24" rx="12" />
        <text x="496" y="313.66">想幫菌裔，交付前先到村邊找她</text>
      </g>
      <g>
        <rect x="444" y="735.75" width="104" height="24" rx="12" />
        <text x="496" y="752.75">同意幫助它們</text>
      </g>
      <g>
        <rect x="133" y="720" width="146" height="24" rx="12" />
        <text x="206" y="737">切斷聯繫／繼續前進</text>
      </g>
      <g>
        <rect x="47" y="896.8" width="90" height="24" rx="12" />
        <text x="92" y="913.8">向蛙王獻血</text>
      </g>
      <g>
        <rect x="226" y="918" width="104" height="24" rx="12" />
        <text x="278" y="935">抵抗蛙王到底</text>
      </g>
      <g>
        <rect x="451" y="902.05" width="90" height="24" rx="12" />
        <text x="496" y="919.05">向蛙王獻血</text>
      </g>
    </g>
    <g class="nodes">
      <g id="doll" class="hub">
        <rect x="342" y="22.5" width="308" height="63" rx="6" />
        <text x="496" y="49">尋回布偶</text>
        <text x="496" y="70" class="detail">從獠牙根森林東側的鼠巢取回玩偶，交還巴洛</text>
      </g>
      <g id="five" class="hub">
        <rect x="412" y="191.14" width="168" height="63" rx="6" />
        <text x="496" y="217.64">逃走的五朵</text>
        <text x="496" y="238.64" class="detail">在村裡收集五朵活蘑菇</text>
      </g>
      <g id="barlo" class="goal">
        <rect x="26" y="373.38" width="276" height="63" rx="6" />
        <text x="164" y="399.88">完成逃走的五朵</text>
        <text x="164" y="420.88" class="detail">獲得 40 金幣、三張食譜與一份地牢吐司</text>
      </g>
      <g id="kin" class="hub">
        <rect x="335" y="373.38" width="322" height="63" rx="6" />
        <text x="496" y="399.88">失蹤的五朵</text>
        <text x="496" y="420.88" class="detail">答應替蓬芙拉女士找回孩子，把五朵全交還給她</text>
      </g>
      <g id="bond">
        <rect x="418" y="501.22" width="156" height="63" rx="6" />
        <text x="496" y="527.72">全隊取得蘑菇聯結</text>
        <text x="496" y="548.72" class="detail">巴洛的蘑菇委託失敗</text>
      </g>
      <g id="field" class="decision">
        <rect x="426" y="629.06" width="140" height="63" rx="10" />
        <text x="496" y="655.56">東園蘑菇田</text>
        <text x="496" y="676.56">要幫助菌絲嗎？</text>
      </g>
      <g id="rebels">
        <rect x="434" y="813.64" width="124" height="42" rx="6" />
        <text x="496" y="840.14">接下反叛之根</text>
      </g>
      <g id="pass">
        <rect x="112" y="813.64" width="188" height="42" rx="6" />
        <text x="206" y="840.14">蘑菇人讓路，未接任務</text>
      </g>
      <g id="kneel" class="goal">
        <rect x="22" y="993.16" width="140" height="42" rx="6" />
        <text x="92" y="1019.66">永遠臣服於蛙王</text>
      </g>
      <g id="fight" class="goal">
        <rect x="176" y="993.16" width="204" height="42" rx="6" />
        <text x="278" y="1019.66">蛙王命令蘑菇人攻擊隊伍</text>
      </g>
      <g id="rise">
        <rect x="410" y="982.66" width="172" height="63" rx="6" />
        <text x="496" y="1009.16">獻血者獲得青蛙印記</text>
        <text x="496" y="1030.16" class="detail">菌絲反抗，與蛙王開戰</text>
      </g>
      <g id="win" class="goal">
        <rect x="396" y="1121.38" width="200" height="63" rx="6" />
        <text x="496" y="1147.88">擊倒蛙王並保住綠蘑菇</text>
        <text x="496" y="1168.88" class="detail">完成反叛之根</text>
      </g>
    </g>
  </g>
</svg>
