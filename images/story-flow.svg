    <path id="L_seller_four_0" d="M323 1002.11 V1132.98" />
    <path id="L_camp_dragon_0" d="M532 517.73 V576.67 H562 V618.14" />
    <path id="L_dragon_three_0" d="M540 676.14 V1132.98" />
    <path id="L_dragon_report_0" d="M644.5 639.14 H700 V771.84" class="branch" />
    <path id="L_report_forge_0" d="M700 811.84 V878.47" />
    <path id="L_forge_axe_0" d="M700 918.47 V986.76" />
