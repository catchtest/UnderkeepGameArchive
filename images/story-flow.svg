    <path id="L_seal_tower_0" d="M484 1323.64 V1404.5" />
  </g>
  <g class="labels">
    <g>
      <rect x="189.4" y="35" width="78" height="24" rx="12" />
      <text x="228.4" y="52">地面塌陷</text>
    </g>
    <g>
      <rect x="463.4" y="35" width="108" height="24" rx="12" />
      <text x="517.4" y="52">回到森林西側</text>
    </g>
    <g>
      <rect x="40" y="481.27" width="152" height="24" rx="12" />
      <text x="116" y="498.27">三把祭司金鑰匙開鎖</text>
    </g>
    <g>
      <rect x="819" y="494.69" width="130" height="24" rx="12" />
      <text x="884" y="511.69">傳送石旁的隱道</text>
    </g>
    <g>
      <rect x="233" y="283.28" width="148" height="24" rx="12" />
      <text x="307" y="300.28">從牢房寶箱取狼頭骨</text>
    </g>
    <g>
      <rect x="247.5" y="624.59" width="151" height="24" rx="12" />
      <text x="323" y="641.59">向布倫娜取得強化鎬</text>
    </g>
    <g>
      <rect x="240" y="842.53" width="166" height="24" rx="12" />
      <text x="323" y="859.53">先前已在村內見過托倫</text>
    </g>
    <g>
      <rect x="676" y="688.39" width="48" height="24" rx="12" />
      <text x="700" y="705.39">支線</text>
    </g>
  </g>
  <g class="nodes">
    <g id="forest" class="hub">
      <rect x="32" y="27" width="120" height="40" rx="6" />
      <text x="92" y="52">獠牙根森林</text>
    </g>
    <g id="tunnel">
      <rect x="315" y="27" width="110" height="40" rx="6" />
      <text x="370" y="52">空墓隧道</text>
    </g>
    <g id="village" class="hub">
      <rect x="620" y="18" width="216" height="58" rx="6" />
      <text x="728" y="41.5">Underkeep 村莊</text>
      <text x="728" y="62.5" class="detail">初遇托倫，收下不明酊劑</text>
    </g>
    <g id="tomb" class="hub">
      <rect x="54" y="181.51" width="262" height="60" rx="6" />
      <text x="185" y="206.01">村南的 Underkeep 墓園</text>
      <text x="185" y="227.01" class="detail">追查雅各布，進入被遺忘者的牢房</text>
    </g>
    <g id="woods" class="hub">
      <rect x="732" y="191.51" width="176" height="40" rx="6" />
      <text x="820" y="216.51">村北的凱爾林森林</text>
    </g>
    <g id="statue">
      <rect x="377" y="340.78" width="216" height="40" rx="6" />
      <text x="485" y="365.78">把狼頭骨放回狼后雕像</text>
    </g>
    <g id="camp" class="hub">
      <rect x="388" y="459.73" width="194" height="58" rx="6" />
      <text x="485" y="483.23">暮谷森林</text>
      <text x="485" y="504.23" class="detail">找到矮人遠征隊</text>
    </g>
    <g id="source">
      <rect x="40" y="755.23" width="152" height="58" rx="6" />
      <text x="116" y="778.73">永眠之室</text>
      <text x="116" y="799.73" class="detail">決定源頭的生死</text>
    </g>
    <g id="marsh">
      <rect x="783" y="755.23" width="202" height="58" rx="6" />
      <text x="884" y="778.73">陰沼 → 泥沼之心</text>
      <text x="884" y="799.73" class="detail">擊殺或放走「那個東西」</text>
    </g>
    <g id="obelisk">
      <rect x="213" y="717.15" width="220" height="58" rx="6" />
      <text x="323" y="740.65">破碎封印深處</text>
      <text x="323" y="761.65" class="detail">鑿開塌方，讀倒下的方尖碑</text>
    </g>
    <g id="seller">
      <rect x="233" y="944.11" width="180" height="58" rx="6" />
      <text x="323" y="967.61">Underkeep 之根</text>
      <text x="323" y="988.61" class="detail">在塔前再遇托倫</text>
    </g>
    <g id="dragon">
      <rect x="479.5" y="618.14" width="165" height="58" rx="6" />
      <text x="562" y="641.64">最後之焰聖所</text>
      <text x="562" y="662.64" class="detail">討伐或驅離古龍</text>
    </g>
    <g id="report">
      <rect x="633" y="771.84" width="134" height="40" rx="6" />
      <text x="700" y="796.84">向杜洛克回報</text>
    </g>
    <g id="forge">
      <rect x="633" y="878.47" width="134" height="40" rx="6" />
      <text x="700" y="903.47">靈魂鍛造爐</text>
    </g>
    <g id="axe">
      <rect x="623" y="986.76" width="154" height="58" rx="6" />
      <text x="700" y="1010.26">向杜洛克回報</text>
      <text x="700" y="1031.26" class="detail">取得靈魂切割者</text>
    </g>
    <g id="one">
      <rect x="44" y="1132.98" width="144" height="58" rx="6" />
      <text x="116" y="1156.48">【第一片】</text>
      <text x="116" y="1177.48" class="detail">源頭旁的寶箱</text>
    </g>
    <g id="two">
      <rect x="808" y="1132.98" width="152" height="58" rx="6" />
      <text x="884" y="1156.48">【第二片】</text>
      <text x="884" y="1177.48" class="detail">泥沼深處的石臺</text>
    </g>
    <g id="three">
      <rect x="459" y="1132.98" width="162" height="58" rx="6" />
      <text x="540" y="1156.48">【第三片】</text>
      <text x="540" y="1177.48" class="detail">龍巢石棺旁的地面</text>
    </g>
    <g id="four">
      <rect x="251" y="1132.98" width="144" height="58" rx="6" />
      <text x="323" y="1156.48">【第四片】</text>
      <text x="323" y="1177.48" class="detail">向托倫購買</text>
