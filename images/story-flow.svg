<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="1000" viewBox="0 0 1010 1000" role="img" aria-labelledby="title desc" lang="zh-Hant">
  <title id="title">Underkeep 主線總覽</title>
  <desc id="desc">在墓園取得狼頭骨，放回凱爾林森林的雕像後進入暮谷森林。矮人提供前往龍巢的線索和調查倒塌方尖碑所需的強化鎬。在村內見過托倫並讀過地下方尖碑，就能在塔前購買第四片。四片符文開塔門，靈魂鍛造爐支線通往靈魂切割者。</desc>
  <style>
    :root { background: #131d24; }
    text { font: 16px "Segoe UI", "Microsoft JhengHei UI", sans-serif; fill: #dce4e7; text-anchor: middle; }
    .paths { fill: none; stroke: #91a7a0; stroke-width: 1.7; stroke-linejoin: round; marker-end: url(#arrow); }
    .branch { stroke-dasharray: 4 4; }
    .nodes rect { fill: #1e2b33; stroke: #50646b; }
    .hub rect { fill: #283a40; stroke: #839d99; }
    .hub text:first-of-type, .decision text { font-weight: 600; }
    .nodes .decision rect { fill: #19272e; stroke: #96b2ae; stroke-dasharray: 3 3; }
    .nodes .goal rect { fill: #39342b; stroke: #e5bb70; stroke-width: 1.5; }
    .goal text:first-of-type { fill: #f0ce91; font-weight: 600; }
    .labels rect { fill: #15222a; stroke: #486169; }
    .labels text, .nodes .detail { font-size: 14px; fill: #c2d0d2; }
  </style>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1" fill="#36434a" />
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#91a7a0" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#dots)" />
  <g class="paths">
    <path id="L_forest_tunnel_0" d="M176 47 H315" />
    <path id="L_tunnel_village_0" d="M425 47 H596" />
    <path id="L_village_tomb_0" d="M674 76 V99 H185 V125" />
    <path id="L_village_woods_0" d="M736 76 V99 H820 V135" />
    <path id="L_tomb_source_0" d="M116 185 V502" />
    <path id="L_source_one_0" d="M116 560 V750" />
    <path id="L_woods_statue_0" d="M780 175 V211 H560 V233" />
    <path id="L_woods_marsh_0" d="M860 175 V198 H884 V502" />
    <path id="L_marsh_two_0" d="M884 560 V750" />
    <path id="L_tomb_statue_0" d="M255 185 V211 H418 V233" />
    <path id="L_statue_camp_0" d="M485 273 V308" />
    <path id="L_camp_obelisk_0" d="M437 366 V393 H323 V477" />
    <path id="L_obelisk_seller_0" d="M323 535 V626" />
    <path id="L_seller_four_0" d="M323 684 V750" />
    <path id="L_camp_dragon_0" d="M532 366 V393 H562 V412" />
    <path id="L_dragon_three_0" d="M540 470 V750" />
    <path id="L_dragon_report_0" d="M644.5 433 H700 V516" class="branch" />
    <path id="L_report_forge_0" d="M700 556 V586" />
    <path id="L_forge_axe_0" d="M700 626 V654" />
    <path id="L_one_seal_0" d="M116 808 V872 H389" />
    <path id="L_two_seal_0" d="M884 808 V872 H579" />
    <path id="L_three_seal_0" d="M540 808 V852" />
    <path id="L_four_seal_0" d="M323 808 V832 H443 V852" />
    <path id="L_seal_tower_0" d="M484 892 V931" />
  </g>
  <g class="labels">
    <g>
      <rect x="206" y="35" width="78" height="24" rx="12" />
      <text x="245" y="52">地面塌陷</text>
    </g>
    <g>
      <rect x="456" y="35" width="108" height="24" rx="12" />
      <text x="510" y="52">回到森林西側</text>
    </g>
    <g>
      <rect x="40" y="373" width="152" height="24" rx="12" />
      <text x="116" y="390">三把祭司金鑰匙開鎖</text>
    </g>
    <g>
      <rect x="819" y="373" width="130" height="24" rx="12" />
      <text x="884" y="390">傳送石旁的隱道</text>
    </g>
    <g>
      <rect x="264" y="199" width="148" height="24" rx="12" />
      <text x="338" y="216">從牢房寶箱取狼頭骨</text>
    </g>
    <g>
      <rect x="247.5" y="427" width="151" height="24" rx="12" />
      <text x="323" y="444">向布倫娜取得強化鎬</text>
    </g>
    <g>
      <rect x="240" y="567" width="166" height="24" rx="12" />
      <text x="323" y="584">先前已在村內見過托倫</text>
    </g>
    <g>
      <rect x="676" y="456" width="48" height="24" rx="12" />
      <text x="700" y="473">支線</text>
    </g>
  </g>
  <g class="nodes">
    <g id="forest" class="hub">
      <rect x="56" y="27" width="120" height="40" rx="6" />
      <text x="116" y="52">獠牙根森林</text>
    </g>
    <g id="tunnel">
      <rect x="315" y="27" width="110" height="40" rx="6" />
      <text x="370" y="52">空墓隧道</text>
    </g>
    <g id="village" class="hub">
      <rect x="596" y="18" width="216" height="58" rx="6" />
      <text x="704" y="41.5">Underkeep 村莊</text>
      <text x="704" y="62.5" class="detail">初遇托倫，收下不明酊劑</text>
    </g>
    <g id="tomb" class="hub">
      <rect x="54" y="125" width="262" height="60" rx="6" />
      <text x="185" y="149.5">村南的 Underkeep 墓園</text>
      <text x="185" y="170.5" class="detail">追查雅各布，進入被遺忘者的牢房</text>
    </g>
    <g id="woods" class="hub">
      <rect x="732" y="135" width="176" height="40" rx="6" />
      <text x="820" y="160">村北的凱爾林森林</text>
    </g>
    <g id="statue">
      <rect x="377" y="233" width="216" height="40" rx="6" />
      <text x="485" y="258">把狼頭骨放回狼后雕像</text>
    </g>
    <g id="camp" class="hub">
      <rect x="388" y="308" width="194" height="58" rx="6" />
      <text x="485" y="331.5">暮谷森林</text>
      <text x="485" y="352.5" class="detail">找到矮人遠征隊</text>
    </g>
    <g id="source">
      <rect x="40" y="502" width="152" height="58" rx="6" />
      <text x="116" y="525.5">永眠之室</text>
      <text x="116" y="546.5" class="detail">決定源頭的生死</text>
    </g>
    <g id="marsh">
      <rect x="783" y="502" width="202" height="58" rx="6" />
      <text x="884" y="525.5">陰沼 → 泥沼之心</text>
      <text x="884" y="546.5" class="detail">擊殺或放走「那個東西」</text>
    </g>
    <g id="obelisk">
      <rect x="213" y="477" width="220" height="58" rx="6" />
      <text x="323" y="500.5">破碎封印深處</text>
      <text x="323" y="521.5" class="detail">鑿開塌方，讀倒下的方尖碑</text>
    </g>
    <g id="seller">
      <rect x="233" y="626" width="180" height="58" rx="6" />
      <text x="323" y="649.5">Underkeep 之根</text>
      <text x="323" y="670.5" class="detail">在塔前再遇托倫</text>
    </g>
    <g id="dragon">
      <rect x="479.5" y="412" width="165" height="58" rx="6" />
      <text x="562" y="435.5">最後之焰聖所</text>
      <text x="562" y="456.5" class="detail">討伐或驅離古龍</text>
    </g>
    <g id="report">
      <rect x="633" y="516" width="134" height="40" rx="6" />
      <text x="700" y="541">向杜洛克回報</text>
    </g>
    <g id="forge">
      <rect x="633" y="586" width="134" height="40" rx="6" />
      <text x="700" y="611">靈魂鍛造爐</text>
    </g>
    <g id="axe">
      <rect x="623" y="654" width="154" height="58" rx="6" />
      <text x="700" y="677.5">向杜洛克回報</text>
      <text x="700" y="698.5" class="detail">取得靈魂切割者</text>
    </g>
    <g id="one">
      <rect x="44" y="750" width="144" height="58" rx="6" />
      <text x="116" y="773.5">【第一片】</text>
      <text x="116" y="794.5" class="detail">源頭旁的寶箱</text>
    </g>
    <g id="two">
      <rect x="808" y="750" width="152" height="58" rx="6" />
      <text x="884" y="773.5">【第二片】</text>
      <text x="884" y="794.5" class="detail">泥沼深處的石臺</text>
    </g>
    <g id="three">
      <rect x="459" y="750" width="162" height="58" rx="6" />
      <text x="540" y="773.5">【第三片】</text>
      <text x="540" y="794.5" class="detail">龍巢石棺旁的地面</text>
    </g>
    <g id="four">
      <rect x="251" y="750" width="144" height="58" rx="6" />
      <text x="323" y="773.5">【第四片】</text>
      <text x="323" y="794.5" class="detail">向托倫購買</text>
    </g>
    <g id="seal" class="hub">
      <rect x="389" y="852" width="190" height="40" rx="6" />
      <text x="484" y="877">在塔門嵌齊四片符文</text>
    </g>
    <g id="tower" class="goal">
      <rect x="420" y="931" width="128" height="42" rx="6" />
      <text x="484" y="957">高塔入口</text>
    </g>
  </g>
</svg>
