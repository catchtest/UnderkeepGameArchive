<template id="walkthrough-view">
<main class="book" tabindex="-1">
  <header class="banner"><h1>流程攻略</h1></header>
  <section id="spoiler-notice" aria-labelledby="spoiler-title" hidden>
    <h2 id="spoiler-title">劇透提示</h2>
    <p>本頁包含主線解謎、劇情分歧與最終結局。</p>
    <button type="button" id="reveal-walkthrough" aria-controls="walkthrough-content">顯示</button>
  </section>
  <div id="walkthrough-content" hidden>
    <section class="walkthrough-flow" aria-labelledby="flow-title">
      <div class="flow-heading">
        <h2 id="flow-title" tabindex="-1">主線總覽</h2>
        <label class="flow-size"><input type="checkbox" aria-controls="flow-viewport"> 原尺寸</label>
      </div>
      <div id="flow-viewport" class="flow-viewport" tabindex="0" role="region" aria-label="主線流程圖">
        <img src="images/story-flow.svg" alt="主線流程圖">
      </div>
    </section>
    <section class="walkthrough-flow" aria-labelledby="ending-title">
      <div class="flow-heading">
        <h2 id="ending-title">結局路線</h2>
        <label class="flow-size"><input type="checkbox" aria-controls="ending-viewport"> 原尺寸</label>
      </div>
      <p>從高塔入口登上五層面見大法師，依三名守護者的生死與隊伍的選擇走向四種結局。</p>
      <div id="ending-viewport" class="flow-viewport" tabindex="0" role="region" aria-labelledby="ending-title">
        <img src="images/ending-flow.svg" alt="結局路線圖">
      </div>
      <p>要觀看四種結局不需要重玩，可靠對話選項與戰鬥交談前將靈魂切割者扔地上的方式切換分支。</p>
      <p>要將托倫推入傳送門，由力量至少 8 的隊員裝備靈魂切割者，等托倫站到門前，再用「虛空脈衝」把他推上感應格 (-1, -12)。</p>
    </section>
    <section class="walkthrough-flow" aria-labelledby="side-quest-title">
      <div class="flow-heading">
        <h2 id="side-quest-title">可選支線任務</h2>
        <label class="flow-size"><input type="checkbox" aria-controls="side-quest-charts"> 原尺寸</label>
      </div>
      <div id="side-quest-charts">
        <h3 id="mayor-title">村長奧爾登的三個委託</h3>
        <div class="flow-viewport" tabindex="0" role="region" aria-labelledby="mayor-title">
          <img src="images/side-quest-mayor.svg" alt="村長委託流程圖">
        </div>
        <h3 id="mushrooms-title">巴洛、五朵蘑菇與東園的蛙王</h3>
        <div class="flow-viewport" tabindex="0" role="region" aria-labelledby="mushrooms-title">
          <img src="images/side-quest-mushrooms.svg" alt="蘑菇與蛙王流程圖">
        </div>
        <h3 id="jacob-title">雅各布、凱勒巴與源頭</h3>
        <div class="flow-viewport" tabindex="0" role="region" aria-labelledby="jacob-title">
          <img src="images/side-quest-jacob.svg" alt="雅各布與源頭流程圖">
        </div>
        <h3 id="wards-title">凱勒巴的西方結界</h3>
        <div class="flow-viewport" tabindex="0" role="region" aria-labelledby="wards-title">
          <img src="images/side-quest-wards.svg" alt="西方結界流程圖">
        </div>
        <h3 id="dwarves-title">矮人遠征、古龍與靈魂鍛造爐</h3>
        <div class="flow-viewport" tabindex="0" role="region" aria-labelledby="dwarves-title">
          <img src="images/side-quest-dwarves.svg" alt="矮人遠征流程圖">
        </div>
      </div>
    </section>
  </div>
</main>
</template>

<template id="map-view">
<header class="top">
  <button type="button" class="drawer-toggle" id="maps-toggle" aria-controls="maps-drawer" aria-expanded="false">地點</button>
  <div class="map-heading"><h1 id="map-title"></h1><p id="map-en" class="english"></p></div>
  <button type="button" class="drawer-toggle" id="layers-toggle" aria-controls="layers-drawer" aria-expanded="false">
    <span class="layers-icon" aria-hidden="true"></span>圖層
  </button>
</header>
<main class="stage" id="stage" aria-labelledby="map-title" tabindex="-1">
  <svg id="map-svg" xmlns="http://www.w3.org/2000/svg" aria-labelledby="map-title" preserveAspectRatio="none"></svg>
  <div class="tools">
    <div class="zoom-group" role="group" aria-label="地圖縮放">
      <button type="button" id="zoom-in" aria-label="放大" title="放大">+</button>
      <button type="button" id="zoom-out" aria-label="縮小" title="縮小">−</button>
    </div>
    <button type="button" id="zoom-fit" aria-label="適合全圖" title="適合全圖">⤢</button>
  </div>
  <div class="map-status"><span id="coords"></span><span id="scale"></span></div>
  <div id="map-tip" class="map-tip" role="group" aria-label="地圖格位提示" hidden></div>
  <nav id="maps-drawer" class="drawer drawer-start" aria-labelledby="maps-title" hidden>
    <div class="panel-heading">
      <h2 id="maps-title">地點一覽</h2>
      <button type="button" class="overview-toggle" id="overview-toggle" aria-haspopup="dialog" aria-controls="map-overview">總覽 <span aria-hidden="true">↗</span></button>
      <button type="button" class="close-button" aria-label="關閉地點一覽">✕</button>
    </div>
    <label class="find"><span aria-hidden="true">⌕</span><input id="map-query" type="search" placeholder="搜尋地名或英文" aria-label="搜尋地圖" aria-keyshortcuts="/"><kbd class="search-key" aria-hidden="true">/</kbd></label>
    <div id="catalog"></div>
  </nav>
  <section id="layers-drawer" class="drawer drawer-end" aria-labelledby="layers-title" hidden>
    <div class="panel-heading">
      <h2 id="layers-title">標記圖層</h2>
      <button type="button" id="reset-types" class="text-button">還原預設</button>
      <button type="button" class="close-button" aria-label="關閉圖層">✕</button>
    </div>
    <div id="filters" class="layer-list"></div>
  </section>
  <section id="details-drawer" class="drawer drawer-end" aria-labelledby="details-title" hidden>
    <div class="panel-heading">
      <h2 id="details-title" aria-live="polite"></h2>
      <button type="button" class="text-button" id="locate-selection">定位</button>
      <button type="button" class="close-button" aria-label="關閉地圖詳情">✕</button>
    </div>
    <div class="detail-scroll" id="selection" aria-live="polite"></div>
  </section>
</main>
<dialog id="map-overview" aria-labelledby="overview-title" closedby="any">
  <header>
    <h2 id="overview-title">地點一覽</h2>
    <form method="dialog"><button class="close-button" aria-label="關閉地點一覽" autofocus>✕</button></form>
  </header>
  <div class="dialog-body overview-scroll">
    <svg id="overview-svg" viewBox="0 0 1140 570" aria-labelledby="overview-title"></svg>
  </div>
</dialog>
</template>
