name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Prepare website files
        run: |
          mkdir dist
          cp -- index.html google2bb38367b58a7b42.html dist/
          cp -R -- css fonts images scripts dist/
      - name: Minify CSS and JavaScript
        shell: bash
        run: |
          find dist/css dist/scripts -type f \( -name '*.css' -o -name '*.js' \) -print0 |
            xargs -0 npx --yes esbuild@0.28.2 --minify-whitespace --minify-syntax --charset=utf8 \
              --legal-comments=inline --outbase=dist --outdir=dist --allow-overwrite --log-level=warning
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
